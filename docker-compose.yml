services:
  comix-vault:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comix-vault
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - CACHE_TTL=3600
    volumes:
      # Persist bookmarks, history, and settings on your Raspberry Pi host
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
